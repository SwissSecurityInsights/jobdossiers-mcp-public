<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Jobdossiers</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header><strong>Jobdossiers</strong> <span id="conn" class="muted">…</span></header>
  <p id="msg" class="msg" hidden></p>
  <form id="f" hidden>
    <label>Impresa <input name="company" required maxlength="300"></label>
    <label>Ruolo <input name="role" required maxlength="300"></label>
    <div class="row">
      <label>Luogo <input name="employer_zip_city" maxlength="300" placeholder="6900 Lugano"></label>
      <label class="cc">Paese <input name="employer_country" maxlength="2" placeholder="CH"></label>
    </div>
    <label>Indirizzo dell'annuncio <input name="job_url" required type="url" maxlength="2000"></label>
    <label>Testo dell'annuncio <span id="src" class="muted"></span>
      <textarea name="job_desc" rows="6"></textarea></label>
    <div id="dups" class="dups" hidden></div>
    <button id="save" type="submit">Salva in Jobdossiers</button>
  </form>
  <p class="muted small">Il testo si cifra su questo computer prima di partire. Suggerimento: seleziona il testo dell'annuncio prima di aprire la finestra.</p>
</body>
</html>

name: Prova Windows
# Costruisce server, app e installer su Windows e li prova davvero: installazione silenziosa, avvio con screenshot, disinstallazione e pulizia
# (win/tests/smoke.ps1). Parte solo quando cambia qualcosa che finisce nel pacchetto Windows; gli screenshot sono negli artefatti.
on:
  pull_request:
    paths: ['win/**', 'src/**', 'scripts/**', 'package.json', '.github/workflows/windows-smoke.yml']
  push:
    branches: [main]
    paths: ['win/**', 'src/**', 'scripts/**', 'package.json', '.github/workflows/windows-smoke.yml']
  workflow_dispatch:
jobs:
  smoke:
    # Nel repo privato solo a mano (Actions → Prova Windows → Run workflow), per esempio prima di una release: sul Mac non si prova
    if: github.repository == 'SwissSecurityInsights/jobdossiers-mcp-public' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: NSIS
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
      - name: Server, app e installer (come win/build.sh)
        shell: pwsh
        run: |
          node scripts/build.mjs windows-x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish win/src/Jobdossiers.Win -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o dist/Jobdossiers-win-x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item dist/jobdossiers-mcp-windows-x64.exe dist/Jobdossiers-win-x64/jobdossiers-mcp.exe
          Copy-Item -Recurse extension dist/Jobdossiers-win-x64/estensione
          Set-Content dist/Jobdossiers-win-x64/LEGGIMI.txt 'Pacchetto della prova automatica.'
          $v = @(([xml](Get-Content win/src/Jobdossiers.Win/Jobdossiers.Win.csproj)).Project.PropertyGroup.Version | Where-Object { $_ })[0]
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -V2 "-DVERSION=$v" "-DSRC=$((Resolve-Path dist/Jobdossiers-win-x64).Path)" "-DOUT=$PWD\dist\Jobdossiers-Setup.exe" win/installer/jobdossiers.nsi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Installazione, avvio e disinstallazione
        shell: pwsh
        run: win/tests/smoke.ps1 -Setup dist/Jobdossiers-Setup.exe -Out smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: prova-windows, path: smoke, if-no-files-found: ignore }

name: Release
# Al tag v* costruisce da questo codice tutto ciò che si installa e lo pubblica nella release del tag:
# app per Mac (Apple silicon), installer e zip per Windows, estensione per Chrome ed Edge, server MCP per macOS, Windows e Linux, SHA256SUMS e attestazioni di provenienza.
# Avviato a mano (workflow_dispatch) fa solo la prova: costruisce e carica gli artefatti, senza release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Il tag corrisponde alle versioni
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          p=$(node -p "require('./package.json').version")
          w=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' win/src/Jobdossiers.Win/Jobdossiers.Win.csproj)
          [ "v$p" = "$GITHUB_REF_NAME" ] && [ "$w" = "$p" ] || { echo "tag $GITHUB_REF_NAME, package.json $p, app Windows $w"; exit 1; }
  mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - run: (cd mac && swift test)
      - name: App e server
        run: |
          sh mac/build-app.sh
          node scripts/build.mjs darwin-x64
          codesign --force --sign - dist/jobdossiers-mcp-darwin-arm64
          codesign --force --sign - dist/jobdossiers-mcp-darwin-x64
          v=$(node -p "require('./package.json').version")
          ditto -c -k --keepParent dist/Jobdossiers.app "dist/Jobdossiers-$v-mac-arm64.zip"
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: "dist/Jobdossiers-*-mac-arm64.zip\ndist/jobdossiers-mcp-darwin-*", if-no-files-found: error }
  windows:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: sudo apt-get update -q && sudo apt-get install -y -q nsis zip
      - name: Installer, zip e server (win/build.sh)
        run: |
          sh win/build.sh
          node scripts/build.mjs linux-x64
          v=$(node -p "require('./package.json').version")
          mv dist/Jobdossiers-win-x64.zip "dist/Jobdossiers-$v-win-x64.zip"
          (cd extension && zip -qr "../dist/Jobdossiers-$v-estensione-browser.zip" .)
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "dist/Jobdossiers-Setup-*-x64.exe\ndist/Jobdossiers-*-win-x64.zip\ndist/Jobdossiers-*-estensione-browser.zip\ndist/jobdossiers-mcp-windows-x64.exe\ndist/jobdossiers-mcp-linux-x64", if-no-files-found: error }
  publish:
    needs: [mac, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Somme di controllo
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: 'dist/*' }
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Prototipo. Le app non sono firmate da Apple né da Microsoft: al primo avvio macOS chiede conferma (clic destro sull'app → Apri) e Windows mostra SmartScreen (Ulteriori informazioni → Esegui comunque).

          - **Mac (Apple silicon):** `Jobdossiers-*-mac-arm64.zip`, da estrarre e spostare in Applicazioni.
          - **Windows:** `Jobdossiers-Setup-*-x64.exe` (installer per l'utente, senza diritti di amministratore) oppure lo zip portatile.
          - **Estensione per Chrome ed Edge (prototipo):** `Jobdossiers-*-estensione-browser.zip`, da estrarre e caricare in Estensioni → modalità sviluppatore → Carica estensione non pacchettizzata; serve l'app (Mac o Windows) installata e collegata ai browser.
          - **Solo server MCP:** `jobdossiers-mcp-<sistema>`, per configurarlo a mano in un client MCP.

          Verifica: `shasum -a 256 -c SHA256SUMS` e `gh attestation verify <file> --repo ${{ github.repository }}`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
